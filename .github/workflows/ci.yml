name: CI Pipeline

[cite_start]on: [push] [cite: 439]

jobs:
  build:
    [cite_start]runs-on: ubuntu-latest [cite: 442]
    steps:
      - [cite_start]uses: actions/checkout@v3 [cite: 444]

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt 

      - name: Run tests
        [cite_start]run: pytest [cite: 273]